name: Autopilot extension CI

on:
  push:
    branches:
      - master
    paths:
      - 'autopilot/**'
      - '.github/workflows/autopilot.yml'
  pull_request:
    paths:
      - 'autopilot/**'
      - '.github/workflows/autopilot.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: autopilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: autopilot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
